{% extends 'base.html' %}{% block content %}<section class="section"><div class="container"><div class="top"><div><div class="badge">{% if is_updated %}PLAN UPDATED{% else %}YOUR PLAN{% endif %}</div><h1>Hey {{user.name}} 👋</h1></div><a class="btn secondary" href="/">New Plan</a></div><div class="grid"><div class="card"><h2>7-Day Workout Plan</h2><pre>{{display_plan}}</pre></div><aside><div class="card"><b class="label">NUTRITION / RECOVERY</b><h2>Daily Tip</h2><p>{{plan.nutrition_tip}}</p></div><div class="card"><b class="label">AI FEEDBACK LOOP</b><h2>Change your plan</h2><form action="/submit-feedback" method="post" id="feedbackForm"><input type="hidden" name="user_id" value="{{user.user_id}}"><textarea name="feedback" required placeholder="Example: Add more cardio and two rest days."></textarea><button class="btn" id="feedbackButton">Update My Plan</button></form></div></aside></div></div></section>{% endblock %}

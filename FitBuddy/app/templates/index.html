{% extends 'base.html' %}{% block content %}<section class="hero"><div><div class="badge">AI FITNESS PLANNER</div><h1>Build a workout plan <span>made for you.</span></h1><p>Generate a personalized 7-day fitness plan using Gemini AI.</p></div><div class="card"><h2>Create Your Plan</h2><form action="/generate-workout" method="post" id="planForm"><label>Name</label><input name="name" required><label>User ID</label><input name="user_id" required><label>Age</label><input name="age" type="number" min="13" required><label>Weight (kg)</label><input name="weight" type="number" step="0.1" required><label>Goal</label><select name="goal" required><option value="">Select</option><option>weight loss</option><option>muscle gain</option><option>general wellness</option><option>strength</option><option>flexibility</option><option>endurance</option></select><label>Intensity</label><div class="row"><label><input type="radio" name="intensity" value="low" required> Low</label><label><input type="radio" name="intensity" value="medium"> Medium</label><label><input type="radio" name="intensity" value="high"> High</label></div><button class="btn" id="generateButton">Generate My Plan</button></form></div></section>{% endblock %}
